
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Shopping</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">ShopEase</div>

    <input type="text" id="search"
        placeholder="Search products...">

    <button onclick="toggleCart()">
        🛒 Cart (<span id="cart-count">0</span>)
    </button>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#products">Products</a>
    <a href="#categories">Categories</a>
</nav>

<section class="hero">
    <h1>Welcome to ShopEase</h1>
    <p>Discover amazing products at amazing prices!</p>
    <a href="#products" class="shop-btn">Shop Now</a>
</section>

<section id="categories">
    <h2>Shop by Category</h2>
    <div class="categories">
        <button onclick="filterCategory('All')">All</button>
        <button onclick="filterCategory('Electronics')">Electronics</button>
        <button onclick="filterCategory('Fashion')">Fashion</button>
        <button onclick="filterCategory('Accessories')">Accessories</button>
    </div>
</section>

<section id="products">
    <h2>Our Products</h2>
    <div class="product-container" id="product-list"></div>
</section>

<div class="cart-panel" id="cart-panel">
    <button class="close" onclick="toggleCart()">✕</button>
    <h2>Shopping Cart</h2>
    <div id="cart-items"></div>
    <h3>Total: ₹<span id="total">0</span></h3>
    <button class="checkout" onclick="checkout()">Checkout</button>
</div>

<footer>
    <p>© 2026 ShopEase. All Rights Reserved.</p>
</footer>

<script src="script.js"></script>
</body>
</html>
